name: Studio online check
# Every 15 minutes: is the studio reachable? If not, this run fails and GitHub emails the repository owner.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reach the studio
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" https://studio.amratpal.in/api/ping || true)
            [ "$code" = "200" ] && echo "Studio is online" && exit 0
            sleep 60
          done
          echo "The studio has not answered for about 3 minutes. Check the office internet, power, and the studio PC."
          exit 1
